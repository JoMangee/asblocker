<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASB domain settings</title>
  <style>
    body { font: 16px/1.45 system-ui, sans-serif; margin: 2rem auto; max-width: 54rem; padding: 0 1rem; color: #202124; }
    h1 { margin-bottom: .35rem; }
    .intro { color: #5f6368; margin-top: 0; }
    fieldset { border: 1px solid #dadce0; border-radius: 8px; margin: 1rem 0; padding: 1rem; }
    legend { font-weight: 650; padding: 0 .35rem; }
    .enabled { display: flex; gap: .5rem; align-items: center; font-weight: 600; }
    .domain-row { display: flex; gap: .5rem; margin: .5rem 0; }
    .domain-row input { flex: 1; min-width: 10rem; padding: .5rem; }
    button { cursor: pointer; padding: .45rem .7rem; }
    .add-domain { margin-top: .35rem; }
    #save { font-size: 1rem; margin: .5rem 0; padding: .65rem 1.1rem; }
    #status { min-height: 1.5em; }
    #status.error { color: #b3261e; }
    #status.success { color: #137333; }
    .hint { color: #5f6368; font-size: .9rem; }
  </style>
</head>
<body>
  <h1>ASB domain settings</h1>
  <p class="intro">Choose categories and domains to block. A domain also matches its subdomains.</p>
  <form id="settings">
    <div id="categories"></div>
    <button id="save" type="submit">Save</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <script src="options.js"></script>
</body>
</html>
